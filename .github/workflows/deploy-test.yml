name: Déploiement sur le site de test

# À chaque envoi sur main (et à la demande), on construit le site
# puis on le dépose sur test.corentin-electricien.fr (protégé par mot de passe).
#
# Le pare-feu d'o2switch bloque les serveurs de GitHub. Méthode documentée par o2switch
# (https://faq.o2switch.fr/cpanel/outils/exception-parefeu/) :
#   1. on ajoute l'adresse IP du serveur GitHub en exception SSH via l'API cPanel (SshWhitelist),
#   2. on envoie le site par rsync sur SSH,
#   3. on retire l'exception, même en cas d'échec (limite : 5 exceptions sur le compte).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Dossier du sous-domaine de test, relatif au dossier personnel cPanel.
  DOSSIER_TEST: test.corentin-electricien.fr

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Construire le site (version test, non indexée)
        run: npm run build
        env:
          PUBLIC_SITE_ENV: test

      - name: Vérifier que les accès sont renseignés
        env:
          O2SWITCH_SERVER: ${{ secrets.O2SWITCH_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          manque=""
          [ -z "$O2SWITCH_SERVER" ] && manque="$manque O2SWITCH_SERVER"
          [ -z "$CPANEL_USER" ] && manque="$manque CPANEL_USER"
          [ -z "$CPANEL_TOKEN" ] && manque="$manque CPANEL_TOKEN"
          [ -z "$SSH_PRIVATE_KEY" ] && manque="$manque SSH_PRIVATE_KEY"
          if [ -n "$manque" ]; then
            echo "::error::Secrets GitHub manquants :$manque (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Préparer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ouvrir le pare-feu o2switch pour ce serveur GitHub
        id: parefeu
        env:
          O2SWITCH_SERVER: ${{ secrets.O2SWITCH_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          IP=$(curl -sS -m 15 https://api.ipify.org)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Adresse du serveur GitHub : $IP"
          reponse=$(curl -sS -m 60 -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
            "https://$O2SWITCH_SERVER:2083/execute/SshWhitelist/add?address=$IP&port=22")
          echo "$reponse" | jq '{status, errors, messages}' || echo "$reponse" | head -c 500
          if [ "$(echo "$reponse" | jq -r '.status' 2>/dev/null)" != "1" ]; then
            echo "::error::o2switch a refusé l'ouverture du pare-feu (jeton API, identifiant cPanel ou nom du serveur incorrect ?)"
            exit 1
          fi
          # Laisser au pare-feu le temps d'appliquer l'exception.
          sleep 10

      - name: Envoyer sur le site de test (rsync sur SSH)
        env:
          O2SWITCH_SERVER: ${{ secrets.O2SWITCH_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"
          for essai in 1 2 3; do
            if rsync -rlz --delete --itemize-changes \
                 --exclude='.htaccess' \
                 --exclude='.well-known/' \
                 --exclude='cgi-bin/' \
                 --exclude='.ftp-deploy-sync-state.json' \
                 -e "$SSH" \
                 dist/ "$CPANEL_USER@$O2SWITCH_SERVER:$DOSSIER_TEST/"; then
              echo "Site de test mis à jour."
              exit 0
            fi
            echo "Essai $essai échoué, nouvelle tentative dans 15 s…"
            sleep 15
          done
          exit 1

      - name: Refermer le pare-feu
        if: always() && steps.parefeu.outputs.ip != ''
        env:
          O2SWITCH_SERVER: ${{ secrets.O2SWITCH_SERVER }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          IP: ${{ steps.parefeu.outputs.ip }}
        run: |
          for sens in in out; do
            curl -sS -m 60 -H "Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN" \
              "https://$O2SWITCH_SERVER:2083/execute/SshWhitelist/remove?address=$IP&port=22&direction=$sens" \
              | jq -c '{status, errors}' || true
          done

      - name: Effacer la clé SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
